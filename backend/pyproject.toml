[project]
name = "skywatch-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anyio>=4,<5",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "jsonschema>=4.23,<5",
    "rfc3339-validator>=0.1.4,<1",
    "paho-mqtt>=2.1,<3",
    "pydantic-settings>=2.8,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
