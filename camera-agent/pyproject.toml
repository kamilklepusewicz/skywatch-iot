[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "skywatch-camera-agent"
version = "0.1.0"
description = "SkyWatch LIVE/REPLAY camera agent (MQTT v1)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "paho-mqtt>=2.1,<3",
  "jsonschema[format]>=4.23,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.8"]

[project.scripts]
skywatch-agent = "skywatch_agent.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skywatch_agent = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a local mosquitto executable and loopback sockets"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
