<!doctype html>
<html lang="pl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkyWatch — podgląd kamery</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0c141b; color: #e9f1f6; }
  body { max-width: 1060px; margin: auto; padding: 24px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 1.5rem; margin: 0; }
  #mode { border-radius: 6px; padding: 6px 12px; background: #193d3a; color: #abf6e3; }
  .viewer { margin-top: 20px; background: #121e27; border: 1px solid #2b3d4b; border-radius: 12px; overflow: hidden; }
  img { display: block; width: 100%; max-height: 74vh; object-fit: contain; }
  #message { padding: 12px 16px; margin: 0; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 18px; font-size: .9rem; }
  dt, .hint { color: #a8bac7; } dd { margin: 0; overflow-wrap: anywhere; }
  #error { color: #ffb7ae; } [hidden] { display: none; }
</style>
<header><h1>SkyWatch · <span id="camera">podgląd kamery</span></h1><span id="mode">Łączenie…</span></header>
<section class="viewer" aria-label="Obraz kamery">
  <img id="image" src="/stream.mjpg" alt="Podgląd obrazu i ramki wykrytych obiektów">
  <p id="message" role="status">Łączenie z agentem…</p>
</section>
<p id="error" role="alert" hidden></p>
<dl>
  <dt>Źródło LIVE</dt><dd id="device">—</dd>
  <dt>Rozdzielczość</dt><dd id="resolution">—</dd>
  <dt>Czas klatki (UTC)</dt><dd id="captured">—</dd>
  <dt>Detektor</dt><dd id="detector">—</dd>
</dl>
<p class="hint">LIVE, REPLAY i zatrzymanie wybierasz w panelu SkyWatch. Ten podgląd działa na komputerze agenta.</p>
<script src="/preview.js"></script>
</html>
