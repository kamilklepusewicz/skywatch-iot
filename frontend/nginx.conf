upstream skywatch_backend {
    zone skywatch_backend 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server backend:8000 resolve;
}

map $preview_camera $preview_port {
    camera_1 8765;
    camera_2 8766;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    location ~ ^/(api|docs|redoc|openapi\.json)(/|$) {
        proxy_pass http://skywatch_backend;
        proxy_set_header Host $http_host;
    }

    location = /ws {
        proxy_pass http://skywatch_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location ~ ^/preview/(?<preview_camera>camera_[12])/(?<preview_resource>status\.json|frame\.jpg|stream\.mjpg)$ {
        if ($host !~ ^(localhost|127\.0\.0\.1)$) { return 403; }

        limit_except GET { deny all; }
        add_header Cross-Origin-Resource-Policy same-origin always;

        resolver 127.0.0.11 valid=30s ipv6=off;
        resolver_timeout 2s;
        proxy_pass http://host.docker.internal:$preview_port/$preview_resource$is_args$args;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        proxy_buffering off;
        proxy_cache off;
    }

    location /preview/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
